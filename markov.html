<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Powers — Markov Chains &amp; Dynamical Systems</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .section {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        textarea {
            width: 100%;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.75rem;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .input-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .input-row > div { flex: 1; min-width: 250px; }
        button {
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        button:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }
        .scalar-input {
            width: 80px;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.6rem;
            font-size: 0.9rem;
            text-align: center;
        }
        .scalar-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .inline-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        #result {
            background: #0f172a;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 1rem;
            white-space: pre;
            overflow-x: auto;
            min-height: 60px;
            color: #4ade80;
            max-height: 70vh;
            overflow-y: auto;
        }
        .error { color: #f87171; }
        .nav-link {
            text-align: center;
            margin-bottom: 1rem;
        }
        .nav-link a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .nav-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-link"><a href="index.html">&larr; Back to Matrix Calculator</a></div>
        <h1>Matrix Powers</h1>
        <p class="subtitle">Compute successive powers of a matrix — useful for Markov chains &amp; discrete dynamical systems</p>

        <div class="section">
            <div class="input-row">
                <div>
                    <label>Matrix A (square)</label>
                    <textarea id="matA"></textarea>
                </div>
                <div>
                    <label>Vector b (column vector, one entry per line — optional)</label>
                    <textarea id="vecB"></textarea>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="inline-group">
                <span style="color: #94a3b8; font-size: 0.875rem;">Compute up to power n =</span>
                <input type="number" id="maxPower" class="scalar-input" min="1" step="1" value="5">
                <button onclick="computePowers()">A<sup>1</sup> … A<sup>n</sup></button>
                <button onclick="computePowerTimesB()">A<sup>1</sup>b … A<sup>n</sup>b</button>
            </div>
        </div>

        <div class="section">
            <label>Result</label>
            <div id="result">Results appear here...</div>
        </div>
    </div>

<script>

function parseMatrix(text) {
    const lines = text.trim().split('\n').filter(l => l.trim());
    if (lines.length === 0) throw new Error('Matrix is empty');
    const data = lines.map((line, i) => {
        const nums = line.trim().split(/[\s,]+/).map(Number);
        if (nums.some(isNaN)) throw new Error(`Invalid number in row ${i + 1}`);
        return nums;
    });
    const cols = data[0].length;
    if (data.some(row => row.length !== cols))
        throw new Error('All rows must have the same number of columns');
    return data;
}

function parseVector(text) {
    const lines = text.trim().split('\n').filter(l => l.trim());
    if (lines.length === 0) throw new Error('Vector is empty');
    return lines.map((line, i) => {
        const v = Number(line.trim());
        if (isNaN(v)) throw new Error(`Invalid number in vector entry ${i + 1}`);
        return [v];
    });
}

function formatMatrix(m) {
    const strs = m.map(row => row.map(v => {
        if (Math.abs(v) < 1e-10) v = 0;
        return Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v).toString() : v.toPrecision(6);
    }));
    const widths = [];
    for (let c = 0; c < strs[0].length; c++) {
        widths.push(Math.max(...strs.map(row => row[c].length)));
    }
    return strs.map(row =>
        '[ ' + row.map((s, c) => s.padStart(widths[c])).join('  ') + ' ]'
    ).join('\n');
}

function matMul(a, b) {
    if (a[0].length !== b.length)
        throw new Error(`Cannot multiply ${a.length}×${a[0].length} by ${b.length}×${b[0].length}`);
    const rows = a.length, inner = a[0].length, cols = b[0].length;
    const result = [];
    for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
            let sum = 0;
            for (let k = 0; k < inner; k++) sum += a[r][k] * b[k][c];
            row.push(sum);
        }
        result.push(row);
    }
    return result;
}

function computePowers() {
    const out = document.getElementById('result');
    try {
        const A = parseMatrix(document.getElementById('matA').value);
        if (A.length !== A[0].length) throw new Error('Matrix A must be square');
        const n = parseInt(document.getElementById('maxPower').value);
        if (isNaN(n) || n < 1) throw new Error('Power n must be a positive integer');

        let text = '';
        let current = A.map(r => [...r]);
        for (let k = 1; k <= n; k++) {
            if (k > 1) current = matMul(current, A);
            text += `A^${k} =\n${formatMatrix(current)}\n\n`;
        }
        out.className = '';
        out.textContent = text.trimEnd();
    } catch (e) {
        out.className = 'error';
        out.textContent = `Error: ${e.message}`;
    }
}

function computePowerTimesB() {
    const out = document.getElementById('result');
    try {
        const A = parseMatrix(document.getElementById('matA').value);
        if (A.length !== A[0].length) throw new Error('Matrix A must be square');
        const b = parseVector(document.getElementById('vecB').value);
        if (A[0].length !== b.length)
            throw new Error(`Dimension mismatch: A is ${A.length}×${A[0].length} but b has ${b.length} entries`);
        const n = parseInt(document.getElementById('maxPower').value);
        if (isNaN(n) || n < 1) throw new Error('Power n must be a positive integer');

        let text = '';
        let current = b;
        for (let k = 1; k <= n; k++) {
            current = matMul(A, current);
            text += `A^${k} × b =\n${formatMatrix(current)}\n\n`;
        }
        out.className = '';
        out.textContent = text.trimEnd();
    } catch (e) {
        out.className = 'error';
        out.textContent = `Error: ${e.message}`;
    }
}

</script>
</body>
</html>
